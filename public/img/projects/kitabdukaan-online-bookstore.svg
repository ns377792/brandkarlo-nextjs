      <stop offset="0%" stop-color="#1f2a24"/>
      <stop offset="100%" stop-color="#0f1512"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8b04b"/>
      <stop offset="100%" stop-color="#c98a2d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- decorative shelf lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="680" x2="1200" y2="680"/>
  </g>

  <!-- open book icon -->
  <g transform="translate(600,330)">
    <path d="M0,-30 C-90,-70 -220,-70 -260,-40 L-260,90 C-220,60 -90,60 0,100 Z" fill="#f4ead9"/>
    <path d="M0,-30 C90,-70 220,-70 260,-40 L260,90 C220,60 90,60 0,100 Z" fill="#efe1c8"/>
    <path d="M0,-30 L0,100" stroke="#c9a86a" stroke-width="3"/>
    <g stroke="#c9a86a" stroke-width="2" opacity="0.6">
      <path d="M-230,-30 C-170,-55 -80,-55 -20,-25"/>
      <path d="M-230,0 C-170,-25 -80,-25 -20,5"/>
      <path d="M-230,30 C-170,5 -80,5 -20,35"/>
      <path d="M230,-30 C170,-55 80,-55 20,-25"/>
      <path d="M230,0 C170,-25 80,-25 20,5"/>
      <path d="M230,30 C170,5 80,5 20,35"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="600" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#f7f1e3">
    KitabDukaan<tspan fill="#e8b04b">.in</tspan>
  </text>
  <rect x="470" y="560" width="260" height="4" fill="url(#accent)"/>
  <text x="600" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" letter-spacing="2" fill="#cfc6b3">
    ONLINE BOOKSTORE · SHOPIFY + SEO
