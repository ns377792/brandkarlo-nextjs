<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a dashboard with bar chart and trend line representing data-driven marketing">
  <defs>
    <linearGradient id="bg-digital" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="blob1-digital" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2-digital" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-digital" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="dotmask-digital" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmaskm-digital">
      <rect width="900" height="600" fill="url(#dotmask-digital)"/>
    </mask>
    <filter id="blur-digital" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg-digital)"/>
  <rect width="900" height="600" fill="url(#dots-digital)" mask="url(#dotmaskm-digital)"/>

  <circle cx="120" cy="90" r="170" fill="url(#blob1-digital)" filter="url(#blur-digital)"/>
  <circle cx="800" cy="520" r="200" fill="url(#blob2-digital)" filter="url(#blur-digital)"/>

  <!-- glass card -->
  <rect x="330" y="150" width="300" height="300" rx="36" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(400 220) scale(0.8)">
    
    <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="70" width="24" height="80" rx="4" fill="#ffffff" fill-opacity="0.25" stroke="none"/>
      <rect x="34" y="40" width="24" height="110" rx="4" fill="#ffffff" fill-opacity="0.4" stroke="none"/>
      <rect x="68" y="90" width="24" height="60" rx="4" fill="#ffffff" fill-opacity="0.25" stroke="none"/>
      <rect x="102" y="10" width="24" height="140" rx="4" fill="#ffffff" fill-opacity="0.55" stroke="none"/>
      <polyline points="10,60 46,30 80,70 114,0" stroke="#818CF8" stroke-width="9"/>
      <circle cx="10" cy="60" r="7" fill="#818CF8" stroke="none"/>
      <circle cx="46" cy="30" r="7" fill="#818CF8" stroke="none"/>
      <circle cx="80" cy="70" r="7" fill="#818CF8" stroke="none"/>
      <circle cx="114" cy="0" r="7" fill="#818CF8" stroke="none"/>
    </g>

  </g>

  
</svg>
