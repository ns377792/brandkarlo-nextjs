<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of an open envelope with a paper airplane representing email marketing">
  <defs>
    <linearGradient id="bg-email" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="blob1-email" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2-email" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-email" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="dotmask-email" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmaskm-email">
      <rect width="900" height="600" fill="url(#dotmask-email)"/>
    </mask>
    <filter id="blur-email" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg-email)"/>
  <rect width="900" height="600" fill="url(#dots-email)" mask="url(#dotmaskm-email)"/>

  <circle cx="120" cy="90" r="170" fill="url(#blob1-email)" filter="url(#blur-email)"/>
  <circle cx="800" cy="520" r="200" fill="url(#blob2-email)" filter="url(#blur-email)"/>

  <!-- glass card -->
  <rect x="330" y="150" width="300" height="300" rx="36" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(400 220) scale(0.8)">
    
    <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="20" width="150" height="105" rx="14" fill="#ffffff" fill-opacity="0.92" stroke="none"/>
      <path d="M6 30 L75 85 L144 30" stroke="#4F46E5" stroke-width="8" fill="none"/>
      <g transform="translate(90 -18) rotate(18)">
        <path d="M0 40 L70 0 L46 70 L34 44 Z" fill="#34D399" stroke="none"/>
        <path d="M0 40 L34 44 L46 70 Z" fill="#059669" stroke="none"/>
      </g>
    </g>

  </g>

  
</svg>
