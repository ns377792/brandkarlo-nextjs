<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a target with an arrow hitting the center representing PPC advertising precision">
  <defs>
    <linearGradient id="bg-ppc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <radialGradient id="blob1-ppc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2-ppc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-ppc" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="dotmask-ppc" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmaskm-ppc">
      <rect width="900" height="600" fill="url(#dotmask-ppc)"/>
    </mask>
    <filter id="blur-ppc" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg-ppc)"/>
  <rect width="900" height="600" fill="url(#dots-ppc)" mask="url(#dotmaskm-ppc)"/>

  <circle cx="120" cy="90" r="170" fill="url(#blob1-ppc)" filter="url(#blur-ppc)"/>
  <circle cx="800" cy="520" r="200" fill="url(#blob2-ppc)" filter="url(#blur-ppc)"/>

  <!-- glass card -->
  <rect x="330" y="150" width="300" height="300" rx="36" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(400 220) scale(0.8)">
    
    <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="70" cy="80" r="70" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff"/>
      <circle cx="70" cy="80" r="46" fill="#ffffff" fill-opacity="0.28" stroke="#ffffff"/>
      <circle cx="70" cy="80" r="22" fill="#ffffff" stroke="none"/>
      <line x1="140" y1="10" x2="80" y2="70" stroke="#FEF3C7" stroke-width="10"/>
      <path d="M140 10 l-10 34 l34 -10 z" fill="#FEF3C7" stroke="none"/>
    </g>

  </g>

  
</svg>
