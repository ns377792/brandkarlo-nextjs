<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a paintbrush and a color palette representing brand identity design">
  <defs>
    <linearGradient id="bg-branding" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="blob1-branding" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2-branding" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-branding" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="dotmask-branding" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmaskm-branding">
      <rect width="900" height="600" fill="url(#dotmask-branding)"/>
    </mask>
    <filter id="blur-branding" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg-branding)"/>
  <rect width="900" height="600" fill="url(#dots-branding)" mask="url(#dotmaskm-branding)"/>

  <circle cx="120" cy="90" r="170" fill="url(#blob1-branding)" filter="url(#blur-branding)"/>
  <circle cx="800" cy="520" r="200" fill="url(#blob2-branding)" filter="url(#blur-branding)"/>

  <!-- glass card -->
  <rect x="330" y="150" width="300" height="300" rx="36" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(400 220) scale(0.8)">
    
    <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 90 a70 45 0 1 1 140 0 a70 45 0 0 1 -140 0 z" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
      <circle cx="45" cy="75" r="11" fill="#7C3AED" stroke="none"/>
      <circle cx="80" cy="60" r="11" fill="#F97316" stroke="none"/>
      <circle cx="115" cy="75" r="11" fill="#34D399" stroke="none"/>
      <circle cx="95" cy="105" r="11" fill="#FBBF24" stroke="none"/>
      <g transform="translate(120 -30) rotate(35)">
        <rect x="0" y="0" width="18" height="60" rx="6" fill="#78350F" stroke="none"/>
        <path d="M-6 -22 h30 l-6 26 h-18 z" fill="#FBBF24" stroke="none"/>
      </g>
    </g>

  </g>

  
</svg>
