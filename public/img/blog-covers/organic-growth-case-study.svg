<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a growth chart rising from zero to a 10,000 visitor milestone, representing organic traffic growth">
  <defs>
    <linearGradient id="bg-organic-growth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="blob1-organic-growth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2-organic-growth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-organic-growth" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="dotmask-organic-growth" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmaskm-organic-growth">
      <rect width="900" height="600" fill="url(#dotmask-organic-growth)"/>
    </mask>
    <filter id="blur-organic-growth" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg-organic-growth)"/>
  <rect width="900" height="600" fill="url(#dots-organic-growth)" mask="url(#dotmaskm-organic-growth)"/>

  <circle cx="120" cy="90" r="170" fill="url(#blob1-organic-growth)" filter="url(#blur-organic-growth)"/>
  <circle cx="800" cy="520" r="200" fill="url(#blob2-organic-growth)" filter="url(#blur-organic-growth)"/>

  <!-- glass card -->
  <rect x="330" y="150" width="300" height="300" rx="36" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(400 220) scale(0.8)">
    
    <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="160" x2="180" y2="160" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4"/>
      <line x1="0" y1="0" x2="0" y2="160" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4"/>
      <polyline points="0,150 35,140 65,120 95,80 130,45 168,10" stroke="#FBBF24" stroke-width="10"/>
      <circle cx="0" cy="150" r="8" fill="#ffffff" stroke="none"/>
      <circle cx="168" cy="10" r="10" fill="#FBBF24" stroke="none"/>
      <g transform="translate(120 -46)">
        <rect x="0" y="0" width="72" height="34" rx="17" fill="#ffffff" stroke="none"/>
        <text x="36" y="23" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#047857" text-anchor="middle">10K</text>
      </g>
    </g>

  </g>

  
</svg>
