<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a document with text lines and a pen representing content marketing">
  <defs>
    <linearGradient id="bg-content" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="blob1-content" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2-content" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-content" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="dotmask-content" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmaskm-content">
      <rect width="900" height="600" fill="url(#dotmask-content)"/>
    </mask>
    <filter id="blur-content" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg-content)"/>
  <rect width="900" height="600" fill="url(#dots-content)" mask="url(#dotmaskm-content)"/>

  <circle cx="120" cy="90" r="170" fill="url(#blob1-content)" filter="url(#blur-content)"/>
  <circle cx="800" cy="520" r="200" fill="url(#blob2-content)" filter="url(#blur-content)"/>

  <!-- glass card -->
  <rect x="330" y="150" width="300" height="300" rx="36" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(400 220) scale(0.8)">
    
    <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="0" width="110" height="150" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="none"/>
      <rect x="28" y="24" width="74" height="9" rx="4" fill="#818CF8" stroke="none"/>
      <rect x="28" y="46" width="74" height="7" rx="3" fill="#CBD5E1" stroke="none"/>
      <rect x="28" y="62" width="74" height="7" rx="3" fill="#CBD5E1" stroke="none"/>
      <rect x="28" y="78" width="50" height="7" rx="3" fill="#CBD5E1" stroke="none"/>
      <rect x="28" y="104" width="74" height="7" rx="3" fill="#CBD5E1" stroke="none"/>
      <rect x="28" y="120" width="60" height="7" rx="3" fill="#CBD5E1" stroke="none"/>
      <g transform="translate(96 96) rotate(40)">
        <rect x="0" y="0" width="14" height="70" rx="5" fill="#F59E0B" stroke="none"/>
        <path d="M-4 -16 h22 l-7 20 h-8 z" fill="#1E293B" stroke="none"/>
      </g>
    </g>

  </g>

  
</svg>
