<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a magnifying glass over a rising bar chart representing SEO ranking growth">
  <defs>
    <linearGradient id="bg-seo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="blob1-seo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2-seo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-seo" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="dotmask-seo" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmaskm-seo">
      <rect width="900" height="600" fill="url(#dotmask-seo)"/>
    </mask>
    <filter id="blur-seo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg-seo)"/>
  <rect width="900" height="600" fill="url(#dots-seo)" mask="url(#dotmaskm-seo)"/>

  <circle cx="120" cy="90" r="170" fill="url(#blob1-seo)" filter="url(#blur-seo)"/>
  <circle cx="800" cy="520" r="200" fill="url(#blob2-seo)" filter="url(#blur-seo)"/>

  <!-- glass card -->
  <rect x="330" y="150" width="300" height="300" rx="36" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(400 220) scale(0.8)">
    
    <g stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="90" width="26" height="60" fill="#ffffff" fill-opacity="0.85" stroke="none"/>
      <rect x="40" y="60" width="26" height="90" fill="#ffffff" fill-opacity="0.85" stroke="none"/>
      <rect x="80" y="30" width="26" height="120" fill="#ffffff" fill-opacity="0.85" stroke="none"/>
      <circle cx="95" cy="55" r="46" fill="none"/>
      <line x1="128" y1="88" x2="168" y2="128"/>
    </g>

  </g>

  
</svg>
